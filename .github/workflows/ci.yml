name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium dependencies
        run: npx puppeteer browsers install chrome --install-deps

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Run feature tests
        env:
          BASE_URL: http://127.0.0.1:4173
          FEATURE_ARTIFACTS_DIR: /tmp/feature-test-artifacts
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/vite-dev.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..30}; do
            if curl --silent --fail "$BASE_URL" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail "$BASE_URL" >/dev/null
          npm run test:features

      - name: Upload feature test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: feature-test-artifacts
          path: |
            /tmp/feature-test-artifacts
            /tmp/vite-dev.log
          if-no-files-found: ignore

      - name: Build
        run: npm run build
