default:
  paths:
    - features/**/*.feature
  # .ts files are loaded with Node's built-in type stripping (Node >= 22.18).
  import:
    - features/support/**/*.ts
    - features/step_definitions/**/*.ts
  format:
    - progress-bar
    - summary

# Post-deploy check against production (deploy.yml); CLI paths don't replace profile paths.
smoke:
  paths:
    - features/site.feature
  import:
    - features/support/**/*.ts
    - features/step_definitions/**/*.ts
  format:
    - progress-bar
    - summary
